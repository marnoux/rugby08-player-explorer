<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Search and inspect every player in the Rugby 08 (2007) game database: ratings, special skills, squads and comparisons.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rugby 08 Player Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky search header over a filter rail + dense ratings grid; the player dossier slides in from the right */
:root{
  --paper:#f3f5f0; --surface:#fcfdfb; --sunk:#e9ede6; --ink:#14211a; --ink-2:#44544b; --muted:#66746c;
  --line:#d8dfd6; --line-2:#c1cbc0; --turf:#17633f; --turf-ink:#ffffff; --turf-wash:#deece2;
  --gold:#9a6a0c; --gold-wash:#f5ead0; --heat:#17633f; --danger:#b3261e; --danger-wash:#fbe9e7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --scrim:rgba(12,20,16,.38); --shadow:0 18px 50px rgba(20,33,26,.18);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:4px; --r-md:8px; --hdr:120px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1310; --surface:#131b17; --sunk:#1b2520; --ink:#e5ece6; --ink-2:#b0bfb6; --muted:#87958d;
    --line:#243029; --line-2:#344239; --turf:#4cb784; --turf-ink:#08130d; --turf-wash:#183022;
    --gold:#e0b04a; --gold-wash:#352a12; --heat:#48b883; --danger:#f2867d; --danger-wash:#3a1d1a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --scrim:rgba(0,0,0,.55); --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1310; --surface:#131b17; --sunk:#1b2520; --ink:#e5ece6; --ink-2:#b0bfb6; --muted:#87958d;
  --line:#243029; --line-2:#344239; --turf:#4cb784; --turf-ink:#08130d; --turf-wash:#183022;
  --gold:#e0b04a; --gold-wash:#352a12; --heat:#48b883; --danger:#f2867d; --danger-wash:#3a1d1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --scrim:rgba(0,0,0,.55); --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
body.has-tray{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
a{color:var(--turf)}
:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mut{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px 10px;max-width:1680px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1;text-decoration:none;color:var(--ink);min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--turf)}
.brand span{font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:.01em}
.search{position:relative;flex:1 1 420px;min-width:0;order:2}
.search-box{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;background:var(--paper);border:1.5px solid var(--line-2);border-radius:var(--r-md)}
.search-box:focus-within{border-color:var(--turf);background:var(--surface)}
.search-box svg{flex:none;color:var(--muted)}
#q{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;height:100%}
#q::placeholder{color:var(--muted)}
.kbd{font-family:var(--f-display);font-size:12px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 6px;color:var(--muted)}
.clear-q{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:4px}
.clear-q:hover{color:var(--ink);background:var(--sunk)}
.tabs{display:flex;gap:2px;order:3;background:var(--sunk);padding:3px;border-radius:var(--r-md)}
.tabs a{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;text-decoration:none;color:var(--ink-2);padding:7px 14px;border-radius:6px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs a .badge{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--turf);color:var(--turf-ink);font-size:12px;text-align:center}
.sub-row{flex-basis:100%;order:6;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-width:0}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.preset:hover{border-color:var(--turf);color:var(--ink)}
.explain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;min-width:0}
.qchip{display:inline-flex;align-items:center;gap:2px;background:var(--turf-wash);border-radius:999px;padding:2px 4px 2px 10px;color:var(--ink)}
.qchip.neg{background:var(--danger-wash)}
.qchip button{border:0;background:none;cursor:pointer;color:var(--ink-2);width:20px;height:20px;border-radius:50%;line-height:1}
.qchip button:hover{background:var(--surface)}
.qerr{color:var(--danger);font-weight:500}

/* Suggestions */
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:var(--shadow);max-height:min(460px,60dvh);overflow:auto;z-index:45;padding:6px}
.sugg-h{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.sugg-i{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer}
.sugg-i[aria-selected="true"],.sugg-i:hover{background:var(--turf-wash)}
.sugg-i code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;color:var(--turf);font-weight:600}
.sugg-i .h{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
code.inl{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}

/* Players view */
main{max-width:1680px;margin:0 auto}
.view{padding-block:18px 28px}
.players-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px) + 12px);max-height:calc(100dvh - var(--hdr) - 30px);overflow:auto;display:flex;flex-direction:column;gap:18px;padding-right:4px}
.rail > details > summary{display:none}
.rail-sec{display:flex;flex-direction:column;gap:8px}
.rail select,.rail input[type=number]{width:100%;height:36px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:0 8px;font-size:14px}
.chipgrid{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:4px 8px;font-size:13px;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:5px;align-items:baseline}
.chip .n{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.chip:hover{border-color:var(--turf)}
.rb{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rb select:first-child{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--turf)}
.btn.primary{background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}
.btn.on{background:var(--turf-wash);border-color:var(--turf)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.syntax{font-size:13px;color:var(--ink-2)}
.syntax summary{cursor:pointer;font-weight:600;color:var(--ink)}
.syntax dl{display:grid;grid-template-columns:auto;gap:6px;margin:8px 0 0}
.syntax dt button{border:0;background:var(--sunk);border-radius:4px;padding:1px 6px;cursor:pointer;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;color:var(--turf);font-weight:600}
.syntax dd{margin:0 0 4px;color:var(--muted)}

.results{min-width:0;display:flex;flex-direction:column;gap:10px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.count{font-size:14px;color:var(--ink-2)}
.count b{font-family:var(--f-display);font-size:22px;color:var(--ink);font-weight:700;margin-right:2px}
.toolbar .spacer{flex:1}
.colt{display:flex;flex-wrap:wrap;gap:4px}
.legend-heat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend-heat i{display:block;width:90px;height:10px;border-radius:3px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--heat) 55%,transparent));border:1px solid var(--line)}
.tablebox{overflow:auto;max-height:max(380px,calc(100dvh - var(--hdr) - 110px - env(safe-area-inset-top,0px)));border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overscroll-behavior:contain}
table.grid{border-collapse:separate;border-spacing:0;font-size:13.5px;font-variant-numeric:tabular-nums;width:max-content;min-width:100%}
.grid th,.grid td{padding:0 7px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;background-clip:padding-box}
.grid td{height:44px}
.grid thead th{position:sticky;background:var(--surface);z-index:2;font-family:var(--f-display);font-weight:600}
.grid thead tr.g th{top:0;height:24px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:0;padding-top:4px}
.grid thead tr.c th{top:24px;height:32px;font-size:13.5px;letter-spacing:.03em;color:var(--ink-2);cursor:pointer;user-select:none;border-bottom:1.5px solid var(--line-2)}
.grid thead tr.c th:hover{color:var(--ink)}
.grid thead th[aria-sort]{color:var(--turf)}
.grid thead th .si{display:inline-block;width:8px;margin-left:2px;font-style:normal}
.grid .st{position:sticky;left:0;z-index:1;background:var(--surface)}
.grid .st2{left:46px;box-shadow:1px 0 0 var(--line)}
.grid thead .st{z-index:3}
.grid .c-idx{min-width:46px;max-width:46px;width:46px;text-align:right;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:15px}
.grid .c-name{text-align:left;min-width:200px;max-width:240px;padding-right:12px}
.grid td.c-name{line-height:1.15}
.grid .nm{display:block;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.grid .sub{display:block;font-size:12px;color:var(--muted)}
.star{color:var(--gold);margin-right:4px;font-size:12px}
.grid .c-team{text-align:left;max-width:200px;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.grid .c-pos{text-align:left}
.pc{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--muted);margin-right:5px;letter-spacing:.03em}
.pc.p1{color:var(--ink)}
.grid td.rt{min-width:42px;text-align:center;background-color:color-mix(in srgb,var(--heat) var(--m,0%),var(--surface))}
.grid td.rt.top{font-weight:700}
.grid .c-ovr{text-align:center}
.grid td.ovr{min-width:50px;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--ink)}
.grid .gs{border-left:1px solid var(--line-2)}
.grid .c-skills{text-align:left}
.sk{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.03em;padding:1px 5px;border-radius:4px;background:var(--turf-wash);color:var(--ink);margin-right:3px}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--ink) 5%,transparent)}
.grid tbody tr:hover td.st2{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--ink) 5%,transparent),1px 0 0 var(--line)}
.grid tbody tr:focus-visible{outline:2px solid var(--turf);outline-offset:-2px}
.grid tbody tr[aria-selected="true"] td.st{box-shadow:inset 3px 0 0 var(--turf)}
.grid tbody tr[aria-selected="true"] td{background-color:color-mix(in srgb,var(--turf) 10%,var(--surface))}
.grid tbody tr[aria-selected="true"] td.rt{background-color:color-mix(in srgb,var(--heat) var(--m,0%),color-mix(in srgb,var(--turf) 10%,var(--surface)))}
.more-row td{text-align:center;color:var(--muted);height:52px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-family:var(--f-display);font-size:22px;margin-bottom:6px;color:var(--ink)}

/* Team card */
.teamcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px;margin-bottom:18px;display:flex;flex-direction:column;gap:16px}
.tc-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.tc-head h2{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.tc-meta{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.tc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.35fr);gap:16px}
.panel{min-width:0;display:flex;flex-direction:column;gap:10px}
.panel h3{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cmpbars{display:flex;flex-direction:column;gap:9px}
.cmpbar{display:grid;grid-template-columns:96px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13px}
.track{position:relative;height:10px;background:var(--sunk);border-radius:0 4px 4px 0}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--turf);border-radius:0 4px 4px 0}
.track .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);transform:translateX(-1px)}
.minilegend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.minilegend i{display:inline-block;width:12px;height:8px;background:var(--turf);border-radius:0 3px 3px 0;margin-right:5px;vertical-align:middle}
.minilegend i.tk{width:2px;height:12px;background:var(--ink);border-radius:0}
.leaders{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:5px 10px;font-size:13.5px;align-items:baseline}
.leaders .l{color:var(--muted)}
.leaders .v{font-weight:700;font-variant-numeric:tabular-nums}
.plink{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.plink:hover{text-decoration-color:var(--turf);color:var(--turf)}
.depth{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:13px}
.depth-row{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--line)}
.depth-row .no{font-family:var(--f-display);font-weight:700;color:var(--turf);font-size:14px}
.depth-row .ps{color:var(--muted);font-size:12px;display:block}
.depth-row .names{display:flex;flex-wrap:wrap;gap:2px 10px}
.depth-row .names .slot{color:var(--muted);font-size:11.5px;margin-left:2px}
.notes{font-size:13px;color:var(--ink-2);background:var(--gold-wash);padding:8px 12px;border-radius:6px;margin:0}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:49}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);box-shadow:var(--shadow);z-index:50;overflow:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.dr-bar{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.dr-bar .pos-of{font-size:13px;color:var(--muted);margin-right:auto}
.dr-sec{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.dr-sec > h3{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dossier-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.ovr-big{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:72px;padding:8px 10px;border-radius:var(--r-md);background:var(--turf-wash)}
.ovr-big .v{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;color:var(--ink)}
.ovr-big .k{font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ovr-line{margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ovr-line b{font-family:var(--f-display);font-size:32px;line-height:1}
.ovr-line span{color:var(--ink-2);font-size:14px}
.ovr-parts{display:flex;flex-wrap:wrap;gap:6px}
.op{display:inline-flex;align-items:baseline;gap:6px;background:var(--paper);border-radius:6px;padding:4px 9px;font-size:13px}
.op .l{color:var(--ink-2)}
.op i{font-style:normal;color:var(--muted);font-size:12px}
.shirt{width:76px;height:84px;display:grid;place-items:center;background:var(--turf);color:var(--turf-ink);font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;clip-path:polygon(22% 0,38% 7%,62% 7%,78% 0,100% 16%,90% 34%,82% 30%,82% 100%,18% 100%,18% 30%,10% 34%,0 16%);padding-top:12px}
.shirt.small{font-size:26px}
.dossier-head h2{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.dossier-head .meta{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.starbadge{display:inline-block;background:var(--gold-wash);color:var(--gold);font-family:var(--f-display);font-weight:600;letter-spacing:.05em;font-size:12.5px;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;text-transform:uppercase}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line-2);border-radius:6px;padding:4px 9px;font-size:13.5px;background:var(--surface)}
.tag b{font-family:var(--f-display);font-weight:700;color:var(--turf)}
button.tag{cursor:pointer}
button.tag:hover{border-color:var(--turf)}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.vital{background:var(--paper);border-radius:6px;padding:10px 12px}
.vital .k{font-size:12px;color:var(--muted)}
.vital .v{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.vital .x{font-size:12.5px;color:var(--ink-2)}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--turf)}
.pips i.on{background:var(--turf)}
.profile{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:center}
.radar{width:100%;height:auto;display:block;max-width:100%}
.radar text{font-family:var(--f-display);font-size:15px;font-weight:600;fill:var(--ink-2)}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.ptable th,.ptable td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable th{font-weight:500;color:var(--muted);font-size:12px}
.key{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.rgroup{display:flex;flex-direction:column;gap:7px}
.rgroup h4{margin:6px 0 2px;font-family:var(--f-display);font-weight:600;font-size:15px;display:flex;justify-content:space-between}
.rgroup h4 span{color:var(--muted);font-weight:500;font-size:13px}
.rrow{display:grid;grid-template-columns:110px minmax(0,1fr) 30px 92px;gap:10px;align-items:center;font-size:13.5px}
.rrow .lbl{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .val{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.rrow .rank{font-size:12px;color:var(--muted);white-space:nowrap}
.rrow .rank.hi{color:var(--turf);font-weight:600}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{font-size:13px;padding:4px 10px;border-radius:999px;border:1px dashed var(--line-2);color:var(--muted)}
.skill.on{border:1px solid var(--turf);background:var(--turf-wash);color:var(--ink);font-weight:600}
.simlist{display:flex;flex-direction:column}
.sim{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sim .d{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.sim .m{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ids{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.ids dt{color:var(--muted)}
.ids dd{margin:0}
.facegrid{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}

/* Teams view */
.teams-intro{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:18px}
.teams-intro h1{font-family:var(--f-display);font-weight:700;font-size:34px;text-transform:uppercase;letter-spacing:.01em}
.tgroup{margin-bottom:26px}
.tgroup h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.tile:hover{border-color:var(--turf)}
.tile .tn{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.05;text-transform:uppercase}
.tile .tm{font-size:12.5px;color:var(--muted)}
.tile .ts{display:flex;gap:12px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tile .ts b{color:var(--ink);font-weight:700}
.datanotes{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 20px;max-width:880px}
.datanotes h2{font-family:var(--f-display);font-size:20px;font-weight:700;margin-bottom:8px;text-transform:uppercase}
.datanotes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);font-size:14px;max-width:72ch}

/* Compare */
.cmp-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.cmp-head h1{font-family:var(--f-display);font-weight:700;font-size:34px;text-transform:uppercase}
.cmp-add{position:relative;width:min(360px,100%)}
.cmp-add input{width:100%;height:40px;border:1.5px solid var(--line-2);border-radius:var(--r-md);padding:0 12px;background:var(--surface)}
.cmp-add input:focus{border-color:var(--turf);outline:none}
.cmp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.cmp-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:4px;position:relative}
.cmp-card .sw{width:28px;height:4px;border-radius:2px}
.cmp-card .cn{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;line-height:1.05}
.cmp-card .cm{font-size:13px;color:var(--muted)}
.cmp-card .x{position:absolute;top:8px;right:8px}
.cmp-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;min-width:0}
.card > h3{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.gbars{display:flex;flex-direction:column;gap:14px}
.gbar h4{margin:0 0 5px;font-size:13.5px;font-weight:600}
.gbar .b{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:8px;align-items:center;margin-bottom:2px}
.gbar .bt{height:12px;position:relative}
.gbar .bf{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0}
.gbar .bv{font-size:12.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.ctable-wrap{overflow-x:auto}
.ctable{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.ctable th,.ctable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ctable th:first-child,.ctable td:first-child{text-align:left;color:var(--ink-2)}
.ctable thead th{font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;color:var(--ink);vertical-align:bottom}
.ctable tr.grp td{font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-top:14px;text-align:left}
.ctable td.best{font-weight:700;color:var(--ink)}
.ctable td.best::before{content:"▲ ";font-size:9px;color:var(--turf);vertical-align:2px}
.cmp-empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-md);padding:28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.cmp-empty h2{font-family:var(--f-display);font-size:24px;text-transform:uppercase}

/* Tray, toast, copy fallback */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line-2);box-shadow:0 -8px 24px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.tray-in{max-width:1680px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:10px;overflow-x:auto}
.tray .lab{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted);white-space:nowrap}
.tray .tp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:13.5px;white-space:nowrap}
.tray .tp i{width:10px;height:10px;border-radius:50%}
.tray .tp button{border:0;background:none;cursor:pointer;width:22px;height:22px;border-radius:50%;color:var(--muted)}
.tray .go{margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px;z-index:70;box-shadow:var(--shadow)}
.copybox{position:fixed;inset:auto 16px calc(16px + env(safe-area-inset-bottom,0px)) 16px;max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px;z-index:71;display:flex;flex-direction:column;gap:8px}
.copybox textarea{width:100%;height:160px;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.loading{padding:60px 0;text-align:center;color:var(--ink-2);font-size:16px}

@media (max-width:1100px){
  .tc-grid{grid-template-columns:1fr 1fr}
  .tc-grid .panel.wide{grid-column:1/-1}
  .cmp-body{grid-template-columns:1fr}
}
@media (max-width:860px){
  .players-layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;overflow:visible;padding:0}
  .rail > details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
  .rail > details > summary{display:list-item;cursor:pointer;font-weight:600}
  .rail > details[open] > .rail-body{margin-top:12px}
  .search{flex-basis:100%;order:5}
  .tabs{margin-left:auto}
  .tablebox{max-height:72dvh}
}
.rail-body{display:flex;flex-direction:column;gap:18px}
@media (max-width:640px){
  .tc-grid{grid-template-columns:1fr}
  .depth{grid-template-columns:1fr}
  .profile{grid-template-columns:1fr}
  .radar{max-width:320px;margin:0 auto}
  .rrow{grid-template-columns:92px minmax(0,1fr) 28px;}
  .rrow .rank{grid-column:2/-1;margin-top:-4px}
  .tc-head h2,.dossier-head h2{font-size:30px}
  .brand span{font-size:20px}
  .tabs a{padding:6px 10px}
  .legend-heat{display:none}
}
@media (prefers-reduced-motion:reduce){ .drawer{animation:none} }
</style>

<body>
<header class="top" id="top">
  <div class="top-in gutter">
    <a class="brand" href="#players" aria-label="Rugby 08 Player Explorer, players view"><b>RUGBY 08</b><span>Player Explorer</span></a>
    <div class="search" role="search">
      <label class="search-box" for="q">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr">Search players</span>
        <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search players, teams, positions… or try speed>90 pos:wing" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">
        <button class="clear-q" id="clear-q" type="button" aria-label="Clear search" hidden>✕</button>
        <span class="kbd" aria-hidden="true">/</span>
      </label>
      <div class="sugg" id="sugg" role="listbox" hidden></div>
    </div>
    <nav class="tabs" aria-label="Views">
      <a href="#players" data-tab="players">Players</a>
      <a href="#teams" data-tab="teams">Teams</a>
      <a href="#compare" data-tab="compare">Compare<span class="badge" id="cmp-badge" hidden>0</span></a>
    </nav>
    <div class="sub-row">
      <div class="explain" id="explain" aria-live="polite"></div>
    </div>
  </div>
</header>

<main class="gutter">
  <div class="loading" id="loading">Loading the player database…</div>

  <section class="view" id="view-players" hidden>
    <div id="teamcard"></div>
    <div class="players-layout">
      <aside class="rail" aria-label="Filters">
        <details id="rail-details" open>
          <summary>Filters and search help</summary>
          <div class="rail-body">
            <div class="rail-sec">
              <p class="eyebrow">Quick picks</p>
              <div class="presets" id="presets"></div>
            </div>
            <div class="rail-sec">
              <label class="eyebrow" for="f-team">Team</label>
              <select id="f-team"></select>
            </div>
            <div class="rail-sec">
              <p class="eyebrow">Position <span class="mut" style="text-transform:none;letter-spacing:0;font-family:var(--f-body)">any listed</span></p>
              <div class="chipgrid" id="f-pos"></div>
            </div>
            <div class="rail-sec">
              <label class="eyebrow" for="f-nat">Nationality</label>
              <select id="f-nat"></select>
            </div>
            <div class="rail-sec">
              <p class="eyebrow">Special skills</p>
              <div class="chipgrid" id="f-skill"></div>
            </div>
            <div class="rail-sec">
              <p class="eyebrow">Flags</p>
              <div class="chipgrid" id="f-flags"></div>
            </div>
            <div class="rail-sec">
              <p class="eyebrow">Rating filter</p>
              <div class="rb">
                <select id="rb-f" aria-label="Rating"></select>
                <select id="rb-op" aria-label="Comparison"><option value=">=">at least</option><option value="<=">at most</option></select>
                <input id="rb-v" type="number" min="0" max="250" value="85" aria-label="Value">
              </div>
              <button class="btn sm" id="rb-add" type="button">Add to search</button>
            </div>
            <details class="syntax rail-sec" id="syntax">
              <summary>Search syntax</summary>
              <dl id="syntax-list"></dl>
            </details>
          </div>
        </details>
      </aside>
      <div class="results">
        <div class="toolbar">
          <div class="count" id="count"></div>
          <div class="mut" id="sortlabel" style="font-size:13px"></div>
          <div class="spacer"></div>
          <div class="colt" id="colt" aria-label="Column groups"></div>
          <div class="legend-heat" title="Rating cells are shaded from 40 (no shade) to 100 (darkest)"><span>40</span><i></i><span>100</span></div>
          <button class="btn sm" id="copy-tsv" type="button">Copy for Excel</button>
        </div>
        <div class="tablebox" id="tablebox">
          <table class="grid" id="grid">
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <section class="view" id="view-teams" hidden></section>
  <section class="view" id="view-compare" hidden></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Player details" hidden></aside>
<div class="tray" id="tray" hidden><div class="tray-in gutter" id="tray-in"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="copybox" id="copybox" hidden>
  <strong>Copy didn't go through. Select the text below and copy it yourself.</strong>
  <textarea id="copytext" readonly></textarea>
  <button class="btn sm" id="copyclose" type="button">Close</button>
</div>

<script>

/* ---------- Data prep ---------- */
function prepare(players, teams) {
  S.teams = teams;
  for (const t of teams) { t.players = []; S.teamBySlug[t.slug] = t; t.nameN = norm(t.name); }
  for (const p of players) {
    p.teams = p.t.map(([slug, slot]) => ({team: S.teamBySlug[slug], slot}));
    for (const m of p.teams) m.team.players.push({p, slot: m.slot});
    p.posIdx = p.pos.map(n => POS_BY_NAME[n]).filter(i => i !== undefined);
    p.p1 = p.posIdx.length ? p.posIdx[0] : -1;
    p.sk = [...p.ss].map(c => c === '1');

    p.nameN = norm(p.name);

    p.order = p.teams[0].team.order * 1000 + p.teams[0].slot;
    p.g = GROUPS.map(g => mean(g.idx.map(i => p.r[i])));

  S.players = players;
  for (const t of teams) {

    const ps = t.players.map(x => x.p);
    t.avg = R.map((_, i) => mean(ps.map(p => p.r[i])));
    t.gAvg = GROUPS.map((_, gi) => mean(ps.map(p => p.g[gi])));
    t.stars = ps.filter(p => p.star);
    t.hCm = mean(ps.map(p => p.h[1])); t.wKg = mean(ps.map(p => p.w[1]));
    t.ovr = mean(ps.map(p => p.ovr));
    const nc = {}; ps.forEach(p => nc[p.nat] = (nc[p.nat] || 0) + 1);
    t.natMix = Object.entries(nc).sort((a, b) => b[1] - a[1]);
  }
  S.dbAvg = R.map((_, i) => mean(players.map(p => p.r[i])));
  S.dbGroupAvg = GROUPS.map((_, gi) => mean(players.map(p => p.g[gi])));
  POS.forEach((pos, pi) => {
    const c = players.filter(p => p.p1 === pi);
    S.cohort[pi] = {
      players: c,
      avg: R.map((_, i) => mean(c.map(p => p.r[i]))),
      gAvg: GROUPS.map((_, gi) => mean(c.map(p => p.g[gi]))),
      vals: R.map((_, i) => c.map(p => p.r[i]).sort((a, b) => b - a)),

}
function rankIn(pi, i, v) { return rankList(S.cohort[pi].vals[i], v); }
function rankOvr(pi, v) { return rankList(S.cohort[pi].ovrVals, v); }
function rankList(vals, v) {

  while (lo < hi) { const mid = (lo + hi) >> 1; if (vals[mid] > v) lo = mid + 1; else hi = mid; }

}

/* ---------- Query language ---------- */
const NUM = {};
R.forEach((r, i) => { const f = {label: r.l, get: p => p.r[i]}; NUM[r.k] = f; (r.al || []).forEach(a => NUM[a] = f); });
GROUPS.forEach((g, gi) => { NUM[g.k] = {label: g.l + ' (average)', get: p => p.g[gi]}; });
NUM.height = {label: 'Height (cm)', get: p => p.h[1]};
NUM.weight = {label: 'Weight (kg)', get: p => p.w[1]};
NUM.resist = {label: 'I. Resist', get: p => p.ir};
NUM.skills = {label: 'Special skills', get: p => p.nSkills};

const TEXTF = ['pos', 'pos1', 'team', 'nat', 'skill', 'is', 'id', 'head'];
const ALLKEYS = [...Object.keys(NUM), ...TEXTF];
const OPSYM = {'>':'>', '<':'<', '>=':'≥', '<=':'≤', '=':'=', ':':'='};

function tokenize(q) {
  const out = []; let i = 0;
  while (i < q.length) {
    while (i < q.length && q[i] === ' ') i++;
    if (i >= q.length) break;
    const start = i; let text = '', inQ = false;
    while (i < q.length && (inQ || q[i] !== ' ')) { if (q[i] === '"') inQ = !inQ; else text += q[i]; i++; }
    out.push({raw: q.slice(start, i), text, start, end: i, quoted: q[start] === '"' || q.slice(start, i).includes('"')});
  }
  return out;
}
function resolvePos(v) {
  const s = new Set(), vv = v.replace(/ /g, '-');
  if (/^forwards?$/.test(vv)) POS.forEach((p, i) => p.u === 'f' && s.add(i));
  else if (/^backs?$/.test(vv)) POS.forEach((p, i) => p.u === 'b' && s.add(i));
  else POS.forEach((p, i) => { if (p.k.includes(vv) || slugify(p.n).startsWith(vv)) s.add(i); });
  return s;
}
function resolveTeams(v) {
  const vv = slugify(v);
  if (S.teamBySlug[vv]) return [S.teamBySlug[vv]];
  const n = norm(v);
  const exact = S.teams.filter(t => t.nameN === n);
  if (exact.length) return exact;
  return S.teams.filter(t => t.nameN.includes(n));
}
function resolveSkill(v) {
  const vv = v.replace(/[\s-]/g, '');
  return SS.map((s, i) => (s.k === vv || s.k.startsWith(vv) || norm(s.l).replace(/ /g, '').startsWith(vv)) ? i : -1).filter(i => i >= 0);
}
function closestKey(k) {
  let best = null, bd = 9;
  for (const c of ALLKEYS) { const d = lev(k, c); if (d < bd) { bd = d; best = c; } }
  return bd <= 3 ? best : null;
}
function parseQuery(q) {
  const toks = tokenize(q), filters = [], errors = [];
  toks.forEach((tok, ti) => {
    let t = tok.text, neg = false;
    if (!t) return;
    if (t.length > 1 && t[0] === '-') { neg = true; t = t.slice(1); }
    const m = !tok.quoted || /^[a-z0-9]+[:<>=]/i.test(t) ? /^([a-z][a-z0-9]*)(>=|<=|>|<|:|=)(.*)$/i.exec(t) : null;
    if (m) {
      const key = m[1].toLowerCase(), op = m[2], val = m[3].trim();
      if (NUM[key]) {
        if (val === '') return;
        const f = NUM[key];
        let test, label;
        const rng = /^(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)$/.exec(val);
        if (rng && (op === ':' || op === '=')) {
          const a = +rng[1], b = +rng[2];
          test = p => { const x = f.get(p); return x >= a && x <= b; };
          label = `${f.label} ${a}–${b}`;
        } else if (/^\d+(\.\d+)?$/.test(val)) {
          const n = +val;
          test = ({'>': p => f.get(p) > n, '<': p => f.get(p) < n, '>=': p => f.get(p) >= n, '<=': p => f.get(p) <= n, '=': p => Math.round(f.get(p)) === n, ':': p => Math.round(f.get(p)) === n})[op];
          label = `${f.label} ${OPSYM[op]} ${n}`;
        } else { errors.push({ti, msg: `“${tok.raw}” needs a number, like ${key}>80`}); return; }
        filters.push({ti, neg, label, test});
        return;
      }
      if (TEXTF.includes(key) && (op === ':' || op === '=')) {
        const vals = val.split(',').map(s => s.trim()).filter(Boolean);
        if (!vals.length) return;
        const nv = vals.map(v => norm(v));
        let test, label;
        if (key === 'pos' || key === 'pos1') {
          const set = new Set(); const bad = [];
          nv.forEach((v, i) => { const s = resolvePos(v); if (!s.size) bad.push(vals[i]); s.forEach(x => set.add(x)); });
          if (bad.length) { errors.push({ti, msg: `No position called “${bad.join(', ')}”. Try wing, fh, n8 or 10`}); return; }
          const names = [...set].map(i => POS[i].n);
          test = key === 'pos' ? p => p.posIdx.some(i => set.has(i)) : p => set.has(p.p1);
          label = `${key === 'pos' ? 'Position' : 'Main position'}: ${names.length > 4 ? names.length + ' positions' : names.join(' or ')}`;
        } else if (key === 'team') {
          const ts = new Set(); const bad = [];
          vals.forEach(v => { const r = resolveTeams(v); if (!r.length) bad.push(v); r.forEach(t => ts.add(t)); });
          if (bad.length) { errors.push({ti, msg: `No team called “${bad.join(', ')}”`}); return; }
          test = p => p.teams.some(m => ts.has(m.team));
          label = `Team: ${[...ts].map(t => t.name).join(' or ')}`;
          filters.push({ti, neg, label, test, teams: [...ts]});
          return;
        } else if (key === 'nat') {
          const hits = S.nats.filter(([n]) => nv.some(v => norm(n).includes(v)));
          if (!hits.length) { errors.push({ti, msg: `No nationality like “${vals.join(', ')}”`}); return; }
          const set = new Set(hits.map(h => h[0]));
          test = p => set.has(p.nat);
          label = `Nationality: ${[...set].join(' or ')}`;
        } else if (key === 'skill') {
          const idx = new Set(); const bad = [];
          vals.forEach(v => { const r = resolveSkill(norm(v)); if (!r.length) bad.push(v); r.forEach(i => idx.add(i)); });
          if (bad.length) { errors.push({ti, msg: `No special skill called “${bad.join(', ')}”`}); return; }
          test = p => [...idx].some(i => p.sk[i]);
          label = `Skill: ${[...idx].map(i => SS[i].l).join(' or ')}`;
        } else if (key === 'is') {
          const ok = nv.every(v => v === 'star' || v === 'multi');
          if (!ok) { errors.push({ti, msg: `Use is:star or is:multi`}); return; }
          test = p => nv.some(v => v === 'star' ? p.star : p.teams.length > 1);
          label = nv.map(v => v === 'star' ? 'Star players' : 'Club and country').join(' or ');
        } else if (key === 'id') {
          test = p => vals.some(v => p.id === v.padStart(5, '0'));
          label = `ID ${vals.join(' or ')}`;
        } else if (key === 'head') {
          test = p => vals.some(v => p.head === v.padStart(5, '0'));
          label = `Head model ${vals.join(' or ')}`;
        }
        filters.push({ti, neg, label, test});
        return;
      }
      if (op === ':' || NUM[key] === undefined) {
        const c = closestKey(key);
        errors.push({ti, msg: `Unknown filter “${key}”${c ? `. Did you mean ${c}?` : ''}`});
        return;
      }
    }
    const n = norm(t);
    if (!n) return;
    filters.push({ti, neg, label: `“${t}”`, test: p => p.hay.includes(n), text: true});
  });
  return {toks, filters, errors};
}

/* ---------- Query editing ---------- */
const qEl = $('#q');
function setQuery(q, sort) {
  qEl.value = q.trim() ? q.trim() + ' ' : '';

}
function keyTokenIndex(toks, key) {
  return toks.findIndex(t => new RegExp('^' + key + '[:=]', 'i').test(t.text));
}
function setKey(key, value) {
  const toks = tokenize(qEl.value);

  else if (i >= 0) toks[i] = {raw: `${key}:${value}`};
  else toks.push({raw: `${key}:${value}`});

}

  vals = vals.map(v => v.toLowerCase());

}

/* ---------- Filtering, sorting ---------- */
let parsed = {toks: [], filters: [], errors: []};
function update() {
  parsed = parseQuery(qEl.value);
  const fs = parsed.filters;
  S.results = S.players.filter(p => fs.every(f => f.neg ? !f.test(p) : f.test(p)));
  const teamFs = fs.filter(f => f.teams && !f.neg);
  S.singleTeam = teamFs.length === 1 && teamFs[0].teams.length === 1 ? teamFs[0].teams[0] : null;
  sortResults();
  $('#clear-q').hidden = !qEl.value.trim();

  if (S.drawerId) renderDrawer(S.drawerId);
}
function slotIn(p, T) { const m = p.teams.find(x => x.team === T); return m ? m.slot : 999; }
function sortVal(p, key) {
  if (key === 'squad') return S.singleTeam ? slotIn(p, S.singleTeam) : p.order;
  if (key === 'name') return p.surname;
  if (key === 'team') return p.teams[0].team.name;
  if (key === 'pos') return p.p1;
  if (key === 'height') return p.h[1];
  if (key === 'weight') return p.w[1];
  if (key === 'skills') return p.nSkills;
  if (key === 'ovr') return p.ovr;

}

  const {key, dir} = S.sort;

    const x = sortVal(a, key), y = sortVal(b, key);
    const c = typeof x === 'string' ? x.localeCompare(y) : x - y;
    return c * dir || a.order - b.order;
  });
}
function sortName(key) {
  if (key === 'squad') return S.singleTeam ? 'squad order' : 'team, then squad order';
  if (key === 'name') return 'surname';
  if (key === 'team') return 'team';
  if (key === 'pos') return 'position';
  if (key === 'height') return 'height';
  if (key === 'weight') return 'weight';
  if (key === 'skills') return 'number of special skills';
  if (key === 'resist') return 'I. Resist';

}

    const prefix = `${neg}${key}:${vals.slice(0, -1).map(v => v + ',').join('')}`;

    else if (key === 'nat') cands = S.nats.map(([n, c]) => [slugify(n), `${c} players`, n]);
    else if (key === 'skill') cands = SS.map(s => [s.k, `${S.players.filter(p => p.sk[SS.indexOf(s)]).length} players`, s.l]);
    else if (key === 'is') cands = [['star', 'Marked ^ in the game file', 'Star players'], ['multi', 'In more than one squad', 'Club and country']];
    cands.filter(([v, , n]) => !last || v.includes(last.replace(/ /g, '-')) || norm(n).includes(last)).slice(0, 40)
      .forEach(([v, h, n]) => items.push({group: 'Values', label: `<code>${esc(key)}:${esc(v)}</code> ${esc(n)}`, hint: h, apply: () => replaceToken(tok, prefix + v + ' ')}));
    return items;
  }
  if (m || /[<>]/.test(t)) return items;

    items.push({group: 'Filters', label: `<code>${esc(ins)}</code>`, hint, apply: () => replaceToken(tok, neg + ins, true)});

  const pm = S.players.filter(p => p.nameN.includes(w)).sort((a, b) => (b.surname.startsWith(w) - a.surname.startsWith(w)) || b.star - a.star || a.surname.localeCompare(b.surname)).slice(0, 8);
  pm.forEach(p => items.push({group: 'Players', label: `${p.star ? '<span class="star">★</span>' : ''}${esc(p.name)}`, hint: `OVR ${p.ovr} · ${POS[p.p1] ? POS[p.p1].n : ''} · ${esc(p.teams.map(m => m.team.name).join(', '))}`, apply: () => { hideSugg(); openPlayerHash(p.id); }}));

}

  });
  series.forEach(sr => {
    const pts = sr.v.map((v, i) => pt(i, v).join(',')).join(' ');
    s += `<polygon points="${pts}" fill="${sr.fill || 'none'}" fill-opacity="${sr.fill ? .14 : 0}" stroke="${sr.color}" stroke-width="${sr.w || 2}" stroke-linejoin="round"/>`;
    if (sr.dots) sr.v.forEach((v, i) => { const [x, y] = pt(i, v); s += `<circle cx="${x}" cy="${y}" r="4.5" fill="${sr.color}" stroke="var(--surface)" stroke-width="2"><title>${esc(labels[i])}: ${r0(v)}</title></circle>`; });
  });
  return s + '</svg>';
}
function similar(p, samePos) {
  const out = [];
  for (const q of S.players) {
    if (q === p || (samePos && q.p1 !== p.p1)) continue;
    let d = 0; for (let i = 0; i < 23; i++) d += Math.abs(q.r[i] - p.r[i]);
    out.push({q, d: d / 23});
  }
  return out.sort((a, b) => a.d - b.d).slice(0, 8);
}

function wireCompareAdd() {
  const inp = $('#cmp-q'), box = $('#cmp-sugg'); if (!inp) return;
  let items = [], act = -1;
  const draw = () => {
    const w = norm(inp.value); act = -1;
    items = w ? S.players.filter(p => p.nameN.includes(w) && !S.compare.includes(p.id)).sort((a, b) => (b.surname.startsWith(w) - a.surname.startsWith(w)) || b.star - a.star).slice(0, 8) : [];
    box.innerHTML = items.map((p, i) => `<button type="button" class="sugg-i" data-i="${i}" aria-selected="false"><span>${p.star ? '<span class="star">★</span>' : ''}${esc(p.name)}</span><span class="h">${POS[p.p1] ? POS[p.p1].a : ''} · ${esc(p.teams[0].team.name)}</span></button>`).join('');
    box.hidden = !items.length;
  };
  const pick = i => { if (items[i]) { toggleCompare(items[i].id); setTimeout(() => { const n = $('#cmp-q'); n && n.focus(); }, 0); } };
  inp.addEventListener('input', draw);
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!items.length) return; act = (act + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; box.querySelectorAll('.sugg-i').forEach((b, i) => b.setAttribute('aria-selected', i === act)); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(act >= 0 ? act : 0); }
    else if (e.key === 'Escape') box.hidden = true;
  });
  box.addEventListener('mousedown', e => e.preventDefault());
  box.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) pick(+b.dataset.i); });
  inp.addEventListener('blur', () => setTimeout(() => box.hidden = true, 120));
}
$('#view-compare').addEventListener('click', e => {

      <li>“I. Resist” sits among the special skills (“SS I. Resist”) but holds a level from 0 to 3 instead of Yes or No. The file doesn't say what it stands for.</li>
      <li>Group averages (Ball play, Athletic, Contact, Set piece, Mindset) are this site's own grouping of the 23 game ratings, not values from the game.</li>
      <li>Overall (OVR) is this site's estimate, not a number from the game: a weighted average of the ratings that matter most for each player's main position (for example Scrummaging and Strength for props, Speed and Acceleration for wings). Fitness isn't included. Open any player to see the exact weights.</li>
      ${S.teams.filter(t => t.notes.length).map(t => `<li>${esc(t.name)}: ${t.notes.map(esc).join(' ')}</li>`).join('')}
      <li>${empty.length} team lists in the file have no players: ${empty.map(t => esc(t.name)).join(', ')}.</li>
    </ul></section>`;
}

/* ---------- Copy ---------- */
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
function copyText(text, ok) {
  const fallback = () => { $('#copytext').value = text; $('#copybox').hidden = false; $('#copytext').focus(); $('#copytext').select(); };
  try {
    navigator.clipboard.writeText(text).then(() => toast(ok), fallback);
  } catch { fallback(); }
}
$('#copyclose').addEventListener('click', () => $('#copybox').hidden = true);
$('#copy-tsv').addEventListener('click', () => {
  const head = ['ID', 'Name', 'Star', 'Nationality', 'Pos 1', 'Pos 2', 'Pos 3', 'Teams', 'Overall (site estimate)', 'Height (in)', 'Height (cm)', 'Weight (lb)', 'Weight (kg)', ...R.map(r => r.l), ...SS.map(s => s.l), 'I. Resist', 'Head model'];
  const rows = S.results.map(p => [p.id, p.name, p.star ? 'Yes' : '', p.nat, p.pos[0] || '', p.pos[1] || '', p.pos[2] || '', p.teams.map(m => `${m.team.name} #${m.slot}`).join('; '), p.ovr, p.h[0], p.h[1], p.w[0], p.w[1], ...p.r, ...p.sk.map(b => b ? 'Yes' : 'No'), p.ir, p.head]);
  copyText([head, ...rows].map(r => r.join('\t')).join('\n'), `Copied ${fmt(S.results.length)} players. Paste into Excel.`);
});

/* ---------- Routing ---------- */
function showView(v) {
  S.view = v;
  ['players', 'teams', 'compare'].forEach(n => $('#view-' + n).hidden = n !== v);
  document.querySelectorAll('.tabs a').forEach(a => { if (a.dataset.tab === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (v === 'teams') renderTeams();
  if (v === 'compare') renderCompare();
  renderTray();
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  let m;
  if ((m = /^player-(\d{5})$/.exec(h))) {
    if (!S.view) showView('players');
    openPlayer(m[1]); return;
  }
  if (S.drawerId && h === S.baseHash) { closeDrawer(); return; }
  closeDrawer();
  if ((m = /^team-([a-z0-9-]+)$/.exec(h)) && S.teamBySlug[m[1]]) {
    S.baseHash = h; showView('players');
    setQuery('team:' + m[1], ['squad', 1]);
    window.scrollTo({top: 0}); return;
  }
  if (h === 'teams' || h === 'compare') { S.baseHash = h; showView(h); window.scrollTo({top: 0}); return; }
  S.baseHash = 'players'; showView('players');
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); if (S.view !== 'players') location.hash = 'players'; qEl.focus(); qEl.select(); return; }
  if (!S.drawerId) return;
  if (e.key === 'Escape') { e.preventDefault(); leaveDrawer(); }
  else if (!typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const i = S.results.indexOf(S.byId[S.drawerId]) + (e.key === 'ArrowRight' ? 1 : -1);
    if (i >= 0 && S.results[i]) openPlayerHash(S.results[i].id);
  }
});
new ResizeObserver(() => document.documentElement.style.setProperty('--hdr', $('#top').offsetHeight + 'px')).observe($('#top'));

/* ---------- Boot ---------- */
async function init() {
  try {
    const [players, teams] = await Promise.all([fetch('players.json').then(r => r.json()), fetch('teams.json').then(r => r.json())]);
    prepare(players, teams);
  } catch (err) {
    $('#loading').textContent = 'The player data could not be loaded. Reload the page to try again.';
    return;
  }
  $('#loading').hidden = true;
  buildRail(); renderColToggles();
  if (window.matchMedia('(max-width:860px)').matches) $('#rail-details').open = false;
  const h = location.hash.slice(1);
  if (!h) { qEl.value = 'team:south-africa '; }
  else if (h.startsWith('player-')) qEl.value = '';
  update();
  route();
  renderTray();
}
init();
</script>
